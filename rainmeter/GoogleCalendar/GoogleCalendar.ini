; Rainmeter Calendar - month view of Google Calendar with events and tasks.
; Generated by @Resources\Tools\gen_ini.py: edit the generator, not this file.
; The repeated sections (cells, bars, panel rows) are meter pools that GCal.lua
; positions and shows/hides. Settings: @Resources\Variables.inc; texts:
; @Resources\Lang\<Language>.inc. Data comes from the Google APIs through
; Scripts\gcal.ps1 (see README.md in the repository).

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=#TxtCtxRefresh#
ContextAction=[!CommandMeasure MeasureScript "RefreshAll()"]
ContextTitle2=#TxtCtxOpenGoogle#
ContextAction2=["https://calendar.google.com"]
ContextTitle3=#TxtCtxConnect#
ContextAction3=[!CommandMeasure MeasureScript "Login()"]
ContextTitle4=#TxtCtxSettings#
ContextAction4=["#@#Variables.inc"]

[Metadata]
Name=Rainmeter Calendar
Information=Month view of Google Calendar and Google Tasks: read, create, complete and delete events and tasks. Setup: README.md in the repository.
Version=3.1
License=MIT

@Include=#@#Variables.inc
; Language file chosen in Variables.inc (Language=en / it ...).
@Include2=#@#Lang\#Language#.inc

; ---------------------------------------------------------------- Measures --

; UpdateDivider=30: every 30 s the script checks for a day change and for the
; automatic sync interval; it redraws only when needed.
[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\GCal.lua
UpdateDivider=30

; Runs gcal.ps1 without a window. The request goes through a file (see
; gcal.ps1), so Parameter is fixed. The outer pair of quotes is needed because
; Rainmeter strips one pair of quotes from the ends of an option: without it the
; quotes closing the request.txt path would be lost.
[MeasureRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter="-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\gcal.ps1" -RequestFile "#@#Google\request.txt""
State=Hide
OutputType=UTF8
FinishAction=[!CommandMeasure MeasureScript "OnRunFinished()"]

[InputTitle]
Measure=Plugin
Plugin=InputText
X=28
Y=197
W=(#Width#-56)
H=24
SolidColor=#ColorFieldInput#
FontColor=#ColorText#
FontFace=#FontFace#
FontSize=10
FocusDismiss=1
DefaultValue=#FormTitle#
DynamicVariables=1
Command1=[!SetVariable FormTitle """$UserInput$"""][!CommandMeasure MeasureScript "OnInput('title')"]

[InputDate]
Measure=Plugin
Plugin=InputText
X=28
Y=253
W=128
H=24
SolidColor=#ColorFieldInput#
FontColor=#ColorText#
FontFace=#FontFace#
FontSize=10
FocusDismiss=1
DefaultValue=#FormDate#
DynamicVariables=1
Command1=[!SetVariable FormDate """$UserInput$"""][!CommandMeasure MeasureScript "OnInput('date')"]

[InputStart]
Measure=Plugin
Plugin=InputText
X=28
Y=309
W=128
H=24
SolidColor=#ColorFieldInput#
FontColor=#ColorText#
FontFace=#FontFace#
FontSize=10
FocusDismiss=1
DefaultValue=#FormStart#
DynamicVariables=1
Command1=[!SetVariable FormStart """$UserInput$"""][!CommandMeasure MeasureScript "OnInput('start')"]

[InputEnd]
Measure=Plugin
Plugin=InputText
X=174
Y=309
W=128
H=24
SolidColor=#ColorFieldInput#
FontColor=#ColorText#
FontFace=#FontFace#
FontSize=10
FocusDismiss=1
DefaultValue=#FormEnd#
DynamicVariables=1
Command1=[!SetVariable FormEnd """$UserInput$"""][!CommandMeasure MeasureScript "OnInput('end')"]

; ------------------------------------------------------------------ Styles --

[StyleText]
FontFace=#FontFace#
AntiAlias=1
FontColor=#ColorText#

[StyleIcon]
FontFace=Segoe MDL2 Assets
AntiAlias=1
StringAlign=CenterCenter

; Clickable area: SolidColor with alpha 1 because a fully transparent area does
; not receive clicks. It lightens slightly on mouse-over.
[StyleHover]
SolidColor=0,0,0,1
MouseOverAction=[!SetOption #CURRENTSECTION# SolidColor 255,255,255,10][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# SolidColor 0,0,0,1][!UpdateMeter #CURRENTSECTION#][!Redraw]

[StyleDayNum]
FontSize=9
StringAlign=CenterCenter
Hidden=1

[StyleBarText]
FontSize=8
ClipString=1
SolidColor=0,0,0,1
Hidden=1

; ------------------------------------------------------------------ Meters --

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#Width#,#BgHeight#,22 | Fill Color #ColorBg# | StrokeWidth 0
DynamicVariables=1

; Header: month (click = back to today), arrows, "+" button (new item).
[MeterMonth]
Meter=String
MeterStyle=StyleText
X=20
Y=22
FontSize=15
Text=
ToolTipText=#TxtTipToday#
LeftMouseUpAction=[!CommandMeasure MeasureScript "Nav(0)"]

[MeterPrev]
Meter=String
MeterStyle=StyleIcon
X=(#Width#-138)
Y=36
FontSize=13
FontColor=#ColorText#
Padding=10,10,10,10
SolidColor=0,0,0,1
Text=[\xE76B]
ToolTipText=#TxtTipPrev#
LeftMouseUpAction=[!CommandMeasure MeasureScript "Nav(-1)"]

[MeterNext]
Meter=String
