[MeterAddBg]
Meter=Shape
Shape=Rectangle (#Width#-62),12,48,48,14 | Fill Color #ColorButton# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureScript "NewForm()"]
ToolTipText=#TxtTipNew#

