; Footer: manual refresh button + status (clickable when a sign-in is needed).
[MeterRefresh]
Meter=String
MeterStyle=StyleText
X=18
Y=0
FontSize=9
FontColor=#ColorAccent#
SolidColor=0,0,0,1
Padding=4,4,8,4
InlineSetting=Face | Segoe MDL2 Assets
InlinePattern=^(.)
Text=[\xE72C]  #TxtRefreshButton#
ToolTipText=#TxtTipRefresh#
LeftMouseUpAction=[!CommandMeasure MeasureScript "RefreshAll()"]

[MeterStatus]
Meter=String
MeterStyle=StyleText
X=(#Width#-20)
Y=0
W=(#Width#-150)
ClipString=1
FontSize=8
FontColor=#ColorDim#
StringAlign=Right
SolidColor=0,0,0,1
Text=#TxtLoading#

; ------------------------------------------------------------------- Panel --
; Overlay panel on top of the grid. Groups: Panel (everything), PDay (the day's
; list), PDetail (item details), PForm (new item), PFormTime (Start/End, hidden
; for "all day" and for tasks). It comes after the grid in the file, so it is
; drawn on top and receives the clicks instead.

; The empty action (Noop) makes the background catch clicks: without it they
; would reach the grid cells hidden underneath.
[PanelBg]
Meter=Shape
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Hidden=1
Group=Panel
LeftMouseUpAction=[!CommandMeasure MeasureScript "Noop()"]

[PanelTitle]
Meter=String
MeterStyle=StyleText
X=24
Y=100
Text=
Hidden=1
Group=Panel
W=(#Width#-90)
H=44
ClipString=2
FontSize=13

[PanelClose]
Meter=String
MeterStyle=StyleIcon
X=(#Width#-34)
Y=112
FontSize=11
FontColor=#ColorDim#
Padding=8,8,8,8
SolidColor=0,0,0,1
Text=[\xE711]
ToolTipText=#TxtTipClose#
Hidden=1
Group=Panel
LeftMouseUpAction=[!CommandMeasure MeasureScript "ClosePanel()"]

